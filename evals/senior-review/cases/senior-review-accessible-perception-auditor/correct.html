<!-- Requirement: Every validation failure must identify the affected field and expose the reason in text or an associated accessible description. Submission rejects empty email. Standard DOM/ARIA semantics apply. The complete styles and handlers are inline. -->
<!doctype html><html lang="en"><title>Email</title><body><form id="form"><label for="email">Email</label><input id="email" type="text" aria-describedby="error"><p id="error" role="status"></p><button>Save</button></form><script>form.onsubmit = event => { event.preventDefault(); if (!email.value) { email.setAttribute('aria-invalid','true'); error.textContent='Email is required'; } else { email.removeAttribute('aria-invalid'); error.textContent=''; } };</script></body></html>

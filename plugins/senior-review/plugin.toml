schema = "daodan/v1"
name = "senior-review"
version = "1.1.4"
description = "Evidence-aware review: it understands the object under review, selects auditors by their mandates, consolidates evidenced findings and reports coverage gaps. Its only product dependency is codebase-map."
license = "MIT"

[capabilities]
required = ["repository.read", "shell.execute", "repository.write", "contexts.isolate", "roles.dispatch"]
optional = ["execution.parallel"]

[dependencies]
required = ["codebase-map"]

[components]
skills = ["defect-taxonomy", "review-quality-gates", "review-method", "review-preparation", "review-consolidation", "application-cleanup-method", "investigation-method"]
roles = ["isolated-worker"]
workflows = []
policies = []

schema = "daodan/v1"
name = "senior-review"
version = "1.0.1"
description = "Evidence-aware review baseline imported from Daodan 1.0.1. It prepares review context, selects auditors, consolidates evidenced findings and reports coverage gaps. In the new two-owner base its only product dependency is codebase-map. Legacy marketplace providers, host commands and export artifacts remain referenced by the imported method but are inactive until adapted."
license = "MIT"

[capabilities]
required = ["repository.read", "shell.execute", "repository.write", "contexts.isolate", "roles.dispatch"]
optional = ["execution.parallel"]

[dependencies]
required = ["codebase-map"]

[components]
skills = ["defect-taxonomy", "review-quality-gates", "review-method", "review-preparation", "review-consolidation", "application-cleanup-method", "investigation-method"]
roles = ["accessibility-auditor", "api-contract-auditor", "chicken-egg-detector", "cleanup-auditor", "code-auditor", "data-integrity-auditor", "distributed-flow-auditor", "logic-integrity-auditor", "operability-auditor", "performance-auditor", "premise-auditor", "resource-lifecycle-auditor", "security-auditor", "temporal-resilience-auditor", "ui-race-auditor", "authorization-auditor", "session-delegation-auditor", "secret-exposure-auditor", "input-validation-auditor", "untrusted-resource-auditor", "browser-security-auditor", "callback-authenticity-auditor", "ai-boundary-auditor", "audit-trail-auditor", "transaction-integrity-auditor", "schema-coherence-auditor", "cache-consistency-auditor", "data-representation-auditor", "data-retention-auditor", "message-delivery-auditor", "remote-effect-auditor", "service-resilience-auditor", "sql-efficiency-auditor", "algorithmic-cost-auditor", "asset-delivery-auditor", "capacity-quota-auditor", "runtime-cost-auditor", "observability-auditor", "service-health-auditor", "release-compatibility-auditor", "environment-binding-auditor", "feature-flag-auditor", "recovery-auditor", "accessible-navigation-auditor", "accessible-perception-auditor", "local-correctness-auditor", "local-concurrency-auditor", "application-reachability-auditor", "dependency-auditor", "dependency-usage-auditor", "dependency-provenance-auditor", "artifact-lifecycle-auditor"]
workflows = []
policies = []

[contracts]
exports = ["contracts/review-brief.toml", "contracts/reviewer-binding.toml", "contracts/reviewer-selection.toml", "contracts/evidenced-finding.toml", "contracts/reviewer-result.toml", "contracts/delivery-ledger.toml", "contracts/final-report.toml"]

[reviewers.compositions.security-auditor]
members = [
  "senior-review:authorization-auditor",
  "senior-review:session-delegation-auditor",
  "senior-review:secret-exposure-auditor",
  "senior-review:input-validation-auditor",

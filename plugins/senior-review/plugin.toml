schema = "daodan/v1"
name = "senior-review"
version = "13.0.0"
description = "Universal evidence-aware code, team and PR review; canonical preparation, consolidation and commit-only application cleanup; testing, structural entropy and workspace hygiene. Specialist React, TypeScript and platform review is owned by review-plus. Seven native review schemas preserve finding provenance and delivery accounting."
license = "MIT"

[capabilities]
required = ["repository.read", "shell.execute", "repository.write", "contexts.isolate", "roles.dispatch"]
optional = ["execution.parallel"]

[dependencies]
required = ["repo-hygiene", "codebase-xray", "abstraction-architect", "testing", "project-protocol"]

[components]
skills = ["defect-taxonomy", "review-quality-gates", "review-method", "review-preparation", "review-consolidation", "application-cleanup-method"]
roles = ["api-contract-auditor", "chicken-egg-detector", "cleanup-auditor", "code-auditor", "data-integrity-auditor", "distributed-flow-auditor", "logic-integrity-auditor", "premise-auditor", "resource-lifecycle-auditor", "security-auditor", "temporal-resilience-auditor", "ui-race-auditor"]
workflows = ["code-review", "pr-review", "team-review"]
policies = []

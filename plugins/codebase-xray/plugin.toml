schema = "daodan/v1"
name = "codebase-xray"
version = "6.0.1"
description = "Compatibility entrypoints for Codebase Map, formerly Codebase X-ray. Retains the old workflow, method and worker identities while using the canonical provider's shared instructions and output contract."
license = "MIT"

[capabilities]
required = ["repository.read", "shell.execute", "repository.write", "contexts.isolate", "roles.dispatch"]
optional = ["execution.parallel"]

[dependencies]
required = ["codebase-map"]

[components]
skills = ["xray-method"]
roles = ["partition-behavior-worker", "partition-quality-worker", "partition-structure-worker", "partition-synthesizer", "semantic-interconnect-mapper"]
workflows = ["analyze", "team-analyze"]
policies = ["write-confinement"]

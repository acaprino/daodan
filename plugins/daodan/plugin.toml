schema = "daodan/v1"
name = "daodan"
version = "2.5.0"
description = "One command per intention, with no parameters: initialize, onboard, check health, brainstorm, investigate, build, fix, refactor, continue, finish, sync, review, map, document, presentation, workbook, theme, verify, humanize, tidy. Each command is a thin entry into the canonical method of its owner, usable alone or as a step of the task cycle; the Office entries drive the `office` methods."
license = "MIT"

[capabilities]
# `network.fetch` is required because this plugin also carries the Office
# entries: their methods fetch a colour source, fonts and imagery.
required = ["repository.read", "repository.write", "shell.execute", "network.fetch", "contexts.isolate", "roles.dispatch"]
optional = ["execution.parallel"]

[dependencies]
required = [
  "abstraction-architect",
  "project-delivery",
  "clean-code",
  "codebase-map",
  "dependency-audit",
  "docker",
  "kotlin-development",
  "moe",
  "office",
  "peer-review",
  "platform-engineering",
  "project-knowledge",
  "project-lifecycle",
  "work-controller",
  "worktree-manager",
  "python-development",
  "react-development",
  "repo-hygiene",
  "senior-review",
  "skill-catalog",
  "testing",
  "text-humanizer",
  "typescript-development",
]

[components]
skills = []
roles = []
workflows = [
  "init-project",
  "onboard-project",
  "check-health",
  "run-maintenance",
  "brainstorm-idea",
  "investigate-problem",
  "get-second-opinion",
  "new-feature",
  "fix-bug",
  "refactor-code",
  "continue-task",
  "show-status",
  "worktrees",
  "finish-task",
  "sync-upstream",
  "review-changes",
  "review-branch",
  "write-tests",
  "map-code",
  "write-docs",
  "record-decision",
  "tidy-repo",
  "start",
  "presentation",
  "document",
  "workbook",
  "verify",
  "fix",
  "theme",
  "humanize-text",
]
policies = []

schema = "daodan/v1"
name = "daodan"
version = "1.0.0"
description = "One command per intention, with no parameters: initialize, onboard, check health, brainstorm, investigate, build, fix, refactor, continue, finish, sync, review, map, document, tidy. Each command is a thin entry into the canonical method of its owner, usable alone or as a step of the task cycle."
license = "MIT"

[capabilities]
required = ["repository.read", "repository.write", "shell.execute", "contexts.isolate", "roles.dispatch"]
optional = ["execution.parallel"]

[dependencies]
required = [
  "abstraction-architect",
  "clean-code",
  "codebase-map",
  "moe",
  "peer-review",
  "platform-engineering",
  "project-knowledge",
  "project-lifecycle",
  "project-protocol",
  "python-development",
  "react-development",
  "repo-hygiene",
  "senior-review",
  "skill-catalog",
  "testing",
  "text-humanizer",
  "typescript-development",
]

[components]
skills = []
roles = []
workflows = [
  "init-project",
  "onboard-project",
  "check-health",
  "run-maintenance",
  "brainstorm-idea",
  "investigate-problem",
  "get-second-opinion",
  "new-feature",
  "fix-bug",
  "refactor-code",
  "continue-task",
  "show-status",
  "finish-task",
  "sync-upstream",
  "review-changes",
  "review-branch",
  "write-tests",
  "map-code",
  "write-docs",
  "record-decision",
  "tidy-repo",
  "humanize-text",
]
policies = []

schema = "daodan/v1"
name = "testing"
version = "3.0.0"
description = "Canonical behavior-driven test authoring, input preparation and suite remediation. Diagnoses runner/configuration and product/oracle/environment failures before temporary quarantine; consolidates with protected behaviors, distinct failure modes and bugfix provenance, using snapshot-bound gates and owned recovery. Python techniques are supplied by the Python owner without a reverse dependency."
license = "MIT"

[capabilities]
required = ["repository.read", "shell.execute", "repository.write", "contexts.isolate", "roles.dispatch"]
optional = ["execution.parallel"]

[dependencies]
required = ["mattpocock-skills@mattpocock", "developer-essentials@claude-code-workflows", "project-protocol"]

[components]
skills = ["test-hygiene", "test-preparation", "test-remediation-method"]
roles = ["test-suite-auditor", "test-writer"]
workflows = ["test-audit", "test-consolidate"]
policies = []

schema = "daodan/v1"
name = "testing"
version = "4.5.1"
description = "Behavior-driven test authoring and suite maintenance: review existing protection, reuse and update checks before justified additions, diagnose failures, and consolidate redundant tests while preserving independent failure modes and bugfix provenance. Snapshot-bound gates and owned recovery govern accepted changes; TDD and browser E2E methods remain delegated to their required providers."
license = "MIT"

[capabilities]
required = ["repository.read", "shell.execute", "repository.write", "contexts.isolate", "roles.dispatch"]
optional = ["execution.parallel"]

[dependencies]
required = ["mattpocock-skills@mattpocock", "developer-essentials@claude-code-workflows", "work-controller", "report-rendering"]

[components]
skills = ["test-hygiene", "test-preparation", "test-remediation-method"]
roles = ["test-suite-auditor", "test-writer", "test-suite-structure-auditor", "test-oracle-auditor", "test-reliability-auditor", "journey-protection-auditor", "contract-test-auditor", "capacity-test-auditor", "ai-evaluation-auditor"]
workflows = []
policies = []

[reviewers.compositions.test-suite-auditor]
members = [
  "testing:test-suite-structure-auditor",
  "testing:test-oracle-auditor",
  "testing:test-reliability-auditor",
  "testing:journey-protection-auditor",
  "testing:contract-test-auditor",
  "testing:capacity-test-auditor",
  "testing:ai-evaluation-auditor",
]

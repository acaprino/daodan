schema = "daodan/v1"
name = "python-development"
version = "1.0.0"
description = "Python development toolkit: pytest techniques with canonical testing authoring, code refactoring with complexity metrics, performance profiling, async patterns, uv package management, dead code detection, comment auditing, project scaffolding, deep Pydantic v2.13 guide (validators/serializers/strict/performance/security/PydanticAI+Logfire) with v1 migration, and a consolidated quality audit method run by /daodan:check-health"
license = "MIT"

[capabilities]
required = ["repository.read", "shell.execute", "repository.write", "contexts.isolate", "roles.dispatch"]
optional = ["execution.parallel", "hooks.lifecycle"]

[dependencies]
required = ["testing", "work-controller"]

[components]
skills = ["async-python-patterns", "pydantic-v2", "python-comments", "python-dead-code", "python-packaging", "python-performance-optimization", "python-refactor-method", "pytest-patterns", "uv-package-manager", "python-audit-method", "python-scaffold-method"]
roles = ["python-engineer", "python-refactor-agent", "python-semantics-auditor"]
workflows = []
policies = []

[routing]

[[routing.keywords]]
words = ["Python"]
target = "python-engineer"

[[routing.keywords]]
words = ["pytest"]
target = "pytest-patterns"

[[routing.keywords]]
words = ["Pydantic"]
target = "pydantic-v2"

[[routing.keywords]]
words = ["uv", "pyproject.toml"]
target = "uv-package-manager"

[[routing.keywords]]
words = ["asyncio"]
target = "async-python-patterns"

[[routing.keywords]]
words = ["PyPI", "wheel", "Python packaging"]
target = "python-packaging"

[[routing.keywords]]
words = ["Python profiling", "Python performance"]
target = "python-performance-optimization"

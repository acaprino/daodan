schema = "daodan/v1"
name = "project-lifecycle"
version = "3.0.1"
description = "Project assessment, consultant handover and guided Senior Maintainer campaigns. Composes ADR-driven delivery through project-delivery while preserving native audits, exact run identities and honest coverage."
license = "MIT"

[capabilities]
required = ["repository.read", "repository.write", "shell.execute", "contexts.isolate", "roles.dispatch"]
optional = ["execution.parallel"]

[dependencies]
required = ["project-delivery", "work-controller", "project-knowledge", "senior-review", "testing", "abstraction-architect", "codebase-map", "repo-hygiene", "clean-code", "react-development", "typescript-development", "platform-engineering", "python-development", "dependency-audit", "skill-catalog", "peer-review", "report-rendering"]

[components]
skills = ["assess-method", "maintainer-method", "handover-method"]
roles = []
workflows = []
policies = ["run-write-confinement"]


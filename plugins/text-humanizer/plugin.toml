description = "Prose humanization toolkit: the text-humanizer editor agent improves prose in any language without inventing content (25 local patterns, including replies that re-explain known context), register-aware (docs, business, personal) with a natural Italian profile, backed by the anti-ai-writing-patterns knowledge base and the humanize method behind /daodan:humanize-text, with optional 5-dimension quality scoring. Self-contained leaf plugin with zero dependencies, consumed by project-knowledge and project-lifecycle, and by digital-marketing and business in Shinatama. Clean-code routes prose requests here without a required dependency. Extracted from digital-marketing in marketplace 13.3.0."
license = "MIT"


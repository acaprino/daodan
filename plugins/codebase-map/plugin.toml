schema = "daodan/v1"
name = "codebase-map"
version = "1.1.0"
description = "Multi-language codebase mapping: inventory, symbols, relationships, modules and semantic descriptions of a repository, served to the agent on demand with verifiable source references. It analyzes architecture, traces data flows and detects anti-patterns. It does not select reviewers or emit correctness verdicts."
license = "MIT"

[capabilities]
required = ["repository.read", "shell.execute", "repository.write", "contexts.isolate", "roles.dispatch"]
optional = ["execution.parallel", "mcp.servers"]

[dependencies]
required = []

[components]
skills = ["map"]
roles = ["map-analyst", "partition-behavior-worker", "partition-quality-worker", "partition-structure-worker", "partition-synthesizer", "semantic-interconnect-mapper"]
workflows = []
policies = ["write-confinement"]

[contracts]
exports = ["contracts/context.toml"]

[[mcp.servers]]
# `${CLAUDE_PLUGIN_ROOT}` is the installed plugin root, expanded by the host (see .mcp.json).
name = "codebase-map"
command = "uv"
args = ["run", "--no-config", "--no-project", "--script", "${CLAUDE_PLUGIN_ROOT}/skills/map/scripts/mcp_server.py"]

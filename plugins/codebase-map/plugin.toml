schema = "daodan/v1"
name = "codebase-map"
version = "1.0.1"
description = "Multi-language codebase mapping: inventory, symbols, relationships, modules and semantic descriptions of a repository, served to the agent on demand with verifiable source references. It analyzes architecture, traces data flows and detects anti-patterns. It does not select reviewers or emit correctness verdicts."
license = "MIT"

[capabilities]
required = ["repository.read", "shell.execute", "repository.write", "contexts.isolate", "roles.dispatch"]
optional = ["execution.parallel", "mcp.servers"]

[dependencies]
required = []

[components]
skills = ["map"]
roles = ["map-analyst", "partition-behavior-worker", "partition-quality-worker", "partition-structure-worker", "partition-synthesizer", "semantic-interconnect-mapper", "system-mapper"]
workflows = []
policies = ["write-confinement"]

[contracts]
exports = ["contracts/context.toml"]

[[mcp.servers]]
# `${CLAUDE_PLUGIN_ROOT}` is the installed plugin root and `${CLAUDE_PROJECT_DIR}` the folder the host starts in,
# both filled by the host (see .mcp.json). uv starts outside the project (`--directory`): it runs the
# interpreter of a `.venv` it finds from its working directory up.
name = "codebase-map"
command = "uv"
args = ["--directory", "${CLAUDE_PLUGIN_ROOT}", "run", "--no-config", "--no-project", "--script", "${CLAUDE_PLUGIN_ROOT}/skills/map/scripts/mcp_server.py", "--project", "${CLAUDE_PROJECT_DIR}"]

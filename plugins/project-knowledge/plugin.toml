schema = "daodan/v1"
name = "project-knowledge"
version = "3.3.0"
description = "Durable project knowledge: instructions, audience-specific guides, implementation drift and README maintenance. Reuses existing documents, plans ownership before writing and preserves evidence, intent and author voice. Audit-only methods are callable independently by the project lifecycle."
license = "MIT"

[capabilities]
required = ["network.fetch", "repository.read", "shell.execute", "repository.write", "contexts.isolate", "roles.dispatch"]
optional = ["execution.parallel"]

[dependencies]
required = ["research", "work-controller", "codebase-map", "text-humanizer", "senior-review", "report-rendering", "diagram-design@diagram-design"]

[components]
skills = ["project-knowledge", "instructions-method", "readme-craft"]
roles = ["codebase-explorer", "doc-humanizer", "documentation-engineer", "documentation-organizer", "flow-writer", "guide-reviewer", "instructions-auditor", "onboarding-writer", "ops-writer", "overview-writer", "tech-writer"]
workflows = []
policies = []

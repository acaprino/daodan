schema = "daodan/v1"
name = "business"
version = "1.0.0"
description = "Legal advisory, compliance document generation, and SaaS business planning - Privacy Policies, Cookie Policies, DPAs, GDPR/ePrivacy/CCPA compliance, contract review, GTM strategy, market sizing, pricing, and positioning"
license = "MIT"

[capabilities]
required = ["repository.read", "repository.write", "network.fetch", "contexts.isolate", "roles.dispatch"]
optional = ["execution.parallel", "hooks.lifecycle"]

[dependencies]
required = ["text-humanizer", "research"]

[components]
skills = ["saas-business-plan"]
roles = ["business-planner", "legal-advisor", "privacy-doc-generator"]
workflows = []
policies = []

[routing]

[[routing.keywords]]
words = ["business plan", "pricing", "go-to-market", "piano aziendale"]
target = "saas-business-plan"

[[routing.keywords]]
words = ["contract", "NDA", "terms of service", "contratto"]
target = "legal-advisor"

[[routing.keywords]]
words = ["privacy policy", "GDPR", "DPA", "informativa privacy"]
target = "privacy-doc-generator"

schema = "daodan/v1"
name = "research"
version = "1.0.0"
description = "Scientific project research with traceable papers, empirical protocols, immutable revision history and Science Mode; deep web research and quick source lookups remain available."
license = "MIT"

[capabilities]
required = ["repository.read", "shell.execute", "repository.write", "network.fetch", "contexts.isolate", "roles.dispatch"]
optional = ["execution.parallel", "hooks.lifecycle"]

[dependencies]
required = ["work-controller"]

[components]
skills = ["web-search-techniques", "science-based-approach"]
roles = ["deep-researcher", "quick-searcher"]
workflows = ["team-research", "science-research", "update-research", "science-mode"]
policies = []

[[hooks]]
name = "science-session"
event = "session-start"
script = "skills/science-based-approach/scripts/science_runtime.py"
args = ["hook"]
timeout = 10

[[hooks]]
name = "science-prompt"
event = "user-prompt-submit"
script = "skills/science-based-approach/scripts/science_runtime.py"
args = ["hook"]
timeout = 10

[routing]
workflows = true

[[routing.keywords]]
words = ["scientific papers", "arXiv", "literature review", "articoli scientifici", "letteratura scientifica"]
target = "science-based-approach"

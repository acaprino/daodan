[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nbproj"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "matplotlib>=3.9"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.2"]

[tool.setuptools.packages.find]
where = ["src"]

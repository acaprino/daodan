[package]
name = "textscan"
version = "0.5.0"
edition = "2021"

[features]
default = ["std"]
std = ["memchr?/std"]
fast = ["dep:memchr"]
float = ["dep:ryu"]

[dependencies]
itoa = { version = "1.0", optional = true }
memchr = { version = "2.7", optional = true, default-features = false }
ryu = { version = "1.0", optional = true }

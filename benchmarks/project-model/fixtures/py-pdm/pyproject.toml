[project]
name = "pdm-demo"
version = "0.1.0"
description = "PDM project"
requires-python = ">=3.9"
dependencies = ["attrs>=23.1"]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.build]
package-dir = "src"

[tool.pdm.dev-dependencies]
dev = ["ruff>=0.6"]

[tool.pdm.scripts]
lint = "ruff check src"

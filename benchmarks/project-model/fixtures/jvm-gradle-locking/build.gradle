plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencyLocking {
    lockAllConfigurations()
}

dependencies {
    api 'org.slf4j:slf4j-api:[2.0,2.1)'
    implementation 'org.apache.commons:commons-lang3:3.+'
}

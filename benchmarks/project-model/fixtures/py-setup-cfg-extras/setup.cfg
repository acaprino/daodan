[metadata]
name = cfg-lib
version = attr: cfg_lib.__version__
description = Library configured through setup.cfg

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    packaging>=23
    typing-extensions>=4.5; python_version < "3.11"

[options.packages.find]
where = src

[options.extras_require]
cli =
    click>=8
docs =
    sphinx>=7
test =
    pluggy>=1.0

[options.entry_points]
console_scripts =
    cfglib = cfg_lib.cli:main

[tool:pytest]
testpaths = tests

[flake8]
max-line-length = 100

apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop-redis
  template:
    metadata:
      labels:
        app: shop-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4.1
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: shop-redis
spec:
  selector:
    app: shop-redis
  ports:
    - port: 6379

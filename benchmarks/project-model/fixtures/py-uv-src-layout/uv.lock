version = 1
requires-python = ">=3.11"

[[package]]
name = "acme-cli"
version = "0.3.0"
source = { editable = "." }
dependencies = [
    { name = "attrs" },
    { name = "click" },
]

[package.optional-dependencies]
color = [
    { name = "colorama" },
]

[package.dev-dependencies]
dev = [
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "attrs", specifier = ">=23.1" },
    { name = "click", specifier = ">=8.1,<9" },
    { name = "colorama", marker = "extra == 'color'", specifier = ">=0.4" },
]

[package.metadata.requires-dev]
dev = [{ name = "ruff", specifier = ">=0.6" }]

[[package]]
name = "attrs"
version = "24.2.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "click"
version = "8.1.7"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "colorama", marker = "sys_platform == 'win32'" },
]

[[package]]
name = "colorama"
version = "0.4.6"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "ruff"
version = "0.6.9"
source = { registry = "https://pypi.org/simple" }

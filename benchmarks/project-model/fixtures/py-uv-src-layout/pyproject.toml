[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "acme-cli"
version = "0.3.0"
description = "Tiny greeting CLI"
requires-python = ">=3.11"
dependencies = ["click>=8.1,<9", "attrs>=23.1"]

[project.optional-dependencies]
color = ["colorama>=0.4"]

[project.scripts]
acme = "acme_cli.main:cli"

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/acme_cli"]

[tool.uv]
required-version = ">=0.4.20"

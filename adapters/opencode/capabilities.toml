# Provisional until the evidence table in tests/host-probes/README.md is measured.
# Every state and strategy row here must be re-derived from that table.
#
# Bound against OpenCode V2 (`@opencode/cli`, source tag v2.0.22). V2's built-in
# tools are read, write, edit, patch, glob, grep, shell, webfetch, websearch,
# skill, subagent and question. A package reaches V2 only as a plugin, so every
# agent and skill below exists because the generated loader registers it.

[capabilities."repository.read"]
state = "native"
strategy = "tool"
value = "read"

[capabilities."repository.write"]
state = "native"
strategy = "tool"
value = "edit"

[capabilities."shell.execute"]
state = "native"
strategy = "tool"
value = "shell"

[capabilities."network.fetch"]
state = "native"
strategy = "tool"
value = "webfetch"

# Agents the loader registers with `mode: subagent` run in a fresh child session
# through the built-in `subagent` tool. No companion package, unlike Pi.
[capabilities."contexts.isolate"]
state = "native"
strategy = "packaged-subagent"

[capabilities."roles.dispatch"]
state = "native"
strategy = "named-agent"

# `background: true` on the subagent tool returns at once and notifies on
# completion, which is what lets one phase's workers run together.
[capabilities."execution.parallel"]
state = "native"
strategy = "concurrent-dispatch"

[capabilities."tasks.share"]
state = "unsupported"
strategy = "none"

[capabilities."peers.message"]
state = "unsupported"
strategy = "none"

# V2 exposes runtime hooks to plugins, but no probe has measured them and no
# plugin requires this capability, so the honest state is unsupported.
[capabilities."hooks.lifecycle"]
state = "unsupported"
strategy = "none"

# The host does not read a `.mcp.json`: the loader registers each declared
# server through the plugin MCP transform, from data the compiler writes. The
# user pastes nothing, which is why this is the manifest strategy rather than
# a registration note, and adapted rather than native.
[capabilities."mcp.servers"]
state = "adapted"
strategy = "mcp-manifest"

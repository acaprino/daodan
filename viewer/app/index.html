<!doctype html>
<html lang="it" data-im-app="daodan" data-im-look="smooth" data-im-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <title>Daodan · Analisi</title>
</head>
<body>
<div class="im-shell" data-im-sidebar="on">
  <a class="im-shell-skip-link" href="#main">Vai al contenuto</a>
  <header class="im-titlebar">
    <button type="button" class="im-icon-btn im-sidebar-toggle" aria-controls="sidebar" aria-expanded="false" aria-label="Navigazione" title="Navigazione">☰</button>
    <div class="im-brand"><span class="im-mark" aria-hidden="true">D</span><span class="im-wordmark">Daodan</span></div>
    <span class="im-spacer"></span><span class="im-chip" id="context-source"></span>
    <button type="button" class="im-titlebar-command" id="command-button" aria-label="Comandi">Comandi</button>
  </header>
  <div class="im-body">
    <aside class="im-panel im-sidebar" id="sidebar" aria-label="Area di lavoro">
      <header class="im-panel-header"><span class="im-avatar" id="selected-repository-mark">D</span><div class="im-row-text"><strong class="im-row-title" id="selected-repository-name">Seleziona repository</strong><small class="im-row-sub" id="selected-repository-meta">GitHub · pubblica</small></div></header>
      <nav class="im-panel-body im-list" aria-label="Navigazione principale">
        <button class="im-row" aria-label="Analisi" data-screen="analysis" title="Analisi" aria-current="page"><span class="im-rail-item" data-icon="chart"></span><span class="im-row-text">Analisi</span></button>
        <button class="im-row" aria-label="Grafo" data-screen="graph" title="Grafo"><span class="im-rail-item" data-icon="graph"></span><span class="im-row-text">Grafo</span><span class="im-count im-row-meta" id="graph-nav-count">–</span></button>
        <button class="im-row" aria-label="Motore e domande" data-screen="engine" title="Motore e domande"><span class="im-rail-item" data-icon="document"></span><span class="im-row-text">Motore e domande</span></button>
      </nav>
      <footer class="im-panel-foot" data-im-rail-detail><div class="im-stack"><strong>App locale</strong><span>Il codice resta sul tuo disco.</span><small id="engine-foot">Motore non scelto.</small></div></footer>
    </aside>
    <div class="im-work">
      <div class="im-status"><span>Progetti / <strong id="crumb-project">–</strong> / <span id="crumb-screen">Analisi</span></span></div>
      <div class="im-columns">
        <main id="main" class="im-panel im-content" tabindex="-1" aria-label="Analisi" aria-busy="false"><div class="im-panel-body"></div></main>
        <section class="im-panel im-inspector" aria-label="Dettaglio" hidden></section>
      </div>
    </div>
  </div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>

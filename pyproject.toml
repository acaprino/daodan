[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daodan"
version = "1.4.0"
description = "Code Intelligence Platform: a verifiable map of the code and a composed, evidence-bound review."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# The pins are the snapshot's identity: the same as `daodan/core/requirements.txt`.
dependencies = ["mcp>=2.0.0,<3", "tree-sitter==0.26.0", "tree-sitter-language-pack==1.13.5", "sqlglot>=30", "keyring>=25", "PyYAML>=6"]

[project.scripts]
daodan = "daodan.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["daodan"]

[tool.pytest.ini_options]
testpaths = ["tests"]  # the benchmarks keep their own suites: some of their modules share a name with the core's

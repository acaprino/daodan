name = "team-analyze"
entrypoint = "team-analyze.md"

[[phases]]
id = "partition-selection"
isolation = "shared"
produces = ["selection:partitions"]

[[phases]]
id = "structure"
needs = ["partition-selection"]
fanout_from = "selection:partitions"
role = "codebase-map/partition-structure-worker"
isolation = "required"
join = "all-delivered"
concurrency = "preferred"
produces = ["artifact:partition-structure"]

[[phases]]
id = "behavior"
needs = ["structure"]
fanout_from = "selection:partitions"
role = "codebase-map/partition-behavior-worker"
isolation = "required"
join = "all-delivered"
concurrency = "preferred"
consumes = ["artifact:partition-structure"]
produces = ["artifact:partition-behavior"]

[[phases]]
id = "quality"
needs = ["structure"]
fanout_from = "selection:partitions"
role = "codebase-map/partition-quality-worker"
isolation = "required"
join = "all-delivered"
concurrency = "preferred"
consumes = ["artifact:partition-structure"]
produces = ["artifact:partition-quality"]

[[phases]]
id = "synthesis"
needs = ["behavior", "quality"]
role = "codebase-map/partition-synthesizer"
isolation = "required"
consumes = [
  "artifact:partition-structure",
  "artifact:partition-behavior",
  "artifact:partition-quality",
]
produces = ["artifact:xray-report"]

[[phases]]
id = "interconnect"
needs = ["synthesis"]
role = "codebase-map/semantic-interconnect-mapper"
isolation = "required"
consumes = ["artifact:xray-report"]
produces = ["artifact:interconnect-map"]

[contract]
inputs = ["repository"]
outcomes = [
  "reviewers-use-isolated-contexts",
  "every-partition-is-owned-by-one-worker",
  "no-worker-writes-outside-its-partition-directory",
  "synthesis-runs-after-every-partition-delivered",
  "artifacts-published-under-xray-root",
]
artifacts = ["xray-report"]
schemas = []

name = "team-review"
entrypoint = "team-review.md"

[dispatch]
roles = [
  "senior-review/api-contract-auditor",
  "senior-review/chicken-egg-detector",
  "senior-review/cleanup-auditor",
  "senior-review/code-auditor",
  "senior-review/data-integrity-auditor",
  "senior-review/distributed-flow-auditor",
  "senior-review/logic-integrity-auditor",
  "senior-review/premise-auditor",
  "senior-review/resource-lifecycle-auditor",
  "senior-review/security-auditor",
  "senior-review/temporal-resilience-auditor",
  "senior-review/ui-race-auditor",
  "repo-hygiene/workspace-auditor",
  "testing/test-suite-auditor",
  "abstraction-architect/abstraction-architect-agent",
  "codebase-xray/semantic-interconnect-mapper",
  "react-development/react-performance-optimizer",
  "typescript-development/type-safety-auditor",
  "platform-engineering/platform-reviewer",
]
isolated = true
inline_workers = true

[[phases]]
id = "prepare"
isolation = "shared"
produces = ["artifact:prepared-review", "selection:react", "selection:typescript", "selection:platform"]

[[phases]]
id = "react"
needs = ["prepare"]
role = "react-development/react-performance-optimizer"
fanout_from = "selection:react"
isolation = "required"
join = "all-delivered"
concurrency = "preferred"
consumes = ["artifact:prepared-review"]
produces = ["artifact:react-result"]

[[phases]]
id = "typescript"
needs = ["prepare"]
role = "typescript-development/type-safety-auditor"
fanout_from = "selection:typescript"
isolation = "required"
join = "all-delivered"
concurrency = "preferred"
consumes = ["artifact:prepared-review"]
produces = ["artifact:typescript-result"]

[[phases]]
id = "platform"
needs = ["prepare"]
role = "platform-engineering/platform-reviewer"
fanout_from = "selection:platform"
isolation = "required"
join = "all-delivered"
concurrency = "preferred"
consumes = ["artifact:prepared-review"]
produces = ["artifact:platform-result"]

[[phases]]
id = "universal-review"
needs = ["react", "typescript", "platform"]
isolation = "shared"
consumes = ["artifact:prepared-review", "artifact:react-result", "artifact:typescript-result", "artifact:platform-result"]
produces = ["artifact:extended-review-report"]

[contract]
inputs = ["repository"]
outcomes = ["all-selected-specialists-accounted-for", "canonical-core-engine-used-once", "extended-review-completed"]
artifacts = ["extended-review-report"]
schemas = []

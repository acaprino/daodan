name = "sync-upstream"
entrypoint = "sync-upstream.md"

[[phases]]
id = "prepare"
isolation = "shared"
produces = ["artifact:work"]

[[phases]]
id = "execute"
needs = ["prepare"]
isolation = "shared"
consumes = ["artifact:work"]
produces = ["artifact:result"]

[dispatch]
roles = [
  "codebase-map/map-analyst",
  "codebase-map/semantic-interconnect-mapper",
  "project-knowledge/codebase-explorer",
  "project-knowledge/doc-humanizer",
  "project-knowledge/documentation-engineer",
  "project-knowledge/flow-writer",
  "project-knowledge/guide-reviewer",
  "project-knowledge/instructions-auditor",
  "project-knowledge/onboarding-writer",
  "project-knowledge/ops-writer",
  "project-knowledge/overview-writer",
  "project-knowledge/tech-writer",
  "text-humanizer/text-humanizer",
]
isolated = true
inline_workers = true

[contract]
inputs = [
  "project",
  "objective",
  "scope",
  "authorization",
]
outcomes = ["scope-and-candidate-identified", "deliveries-and-required-gates-accounted", "limits-and-open-actions-visible"]
artifacts = ["result"]
schemas = []
shared_schemas = ["work-controller/contracts/work.toml", "work-controller/contracts/project-result.toml"]

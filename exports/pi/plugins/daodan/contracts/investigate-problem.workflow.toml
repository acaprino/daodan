name = "investigate-problem"
entrypoint = "investigate-problem.md"

[[phases]]
id = "prepare"
isolation = "shared"
produces = ["artifact:work"]

[[phases]]
id = "execute"
needs = ["prepare"]
isolation = "shared"
consumes = ["artifact:work"]
produces = ["artifact:result"]

[dispatch]
roles = [
  "codebase-map/map-analyst",
  "senior-review/chicken-egg-detector",
  "senior-review/code-auditor",
  "senior-review/data-integrity-auditor",
  "senior-review/distributed-flow-auditor",
  "senior-review/logic-integrity-auditor",
  "senior-review/resource-lifecycle-auditor",
  "senior-review/temporal-resilience-auditor",
  "senior-review/ui-race-auditor",
  "testing/test-writer",
]
isolated = true
inline_workers = true

[contract]
inputs = [
  "project",
  "objective",
  "scope",
  "authorization",
]
outcomes = ["scope-and-candidate-identified", "deliveries-and-required-gates-accounted", "limits-and-open-actions-visible"]
artifacts = ["result"]
schemas = []
shared_schemas = ["work-controller/contracts/work.toml", "work-controller/contracts/project-result.toml"]

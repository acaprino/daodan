name = "check-health"
entrypoint = "check-health.md"

[[phases]]
id = "prepare"
isolation = "shared"
produces = [
  "artifact:work",
  "selection:cleanup",
  "selection:tests",
  "selection:structure",
  "selection:instructions",
  "selection:workspace",
]

[[phases]]
id = "audit-cleanup"
needs = ["prepare"]
role = "senior-review/cleanup-auditor"
fanout_from = "selection:cleanup"
isolation = "required"
join = "all-delivered"
concurrency = "preferred"
consumes = ["artifact:work"]
produces = ["artifact:cleanup-report"]

[[phases]]
id = "audit-tests"
needs = ["prepare"]
role = "testing/test-suite-auditor"
fanout_from = "selection:tests"
isolation = "required"
join = "all-delivered"
concurrency = "preferred"
consumes = ["artifact:work"]
produces = ["artifact:tests-report"]

[[phases]]
id = "audit-structure"
needs = ["prepare"]
role = "abstraction-architect/abstraction-architect-agent"
fanout_from = "selection:structure"
isolation = "required"
join = "all-delivered"
concurrency = "preferred"
consumes = ["artifact:work"]
produces = ["artifact:structure-report"]

[[phases]]
id = "audit-instructions"
needs = ["prepare"]
role = "project-knowledge/instructions-auditor"
fanout_from = "selection:instructions"
isolation = "required"
join = "all-delivered"
concurrency = "preferred"
consumes = ["artifact:work"]
produces = ["artifact:instructions-report"]

[[phases]]
id = "audit-workspace"
needs = ["prepare"]
role = "repo-hygiene/workspace-auditor"
fanout_from = "selection:workspace"
isolation = "required"
join = "all-delivered"
concurrency = "preferred"
consumes = ["artifact:work"]
produces = ["artifact:workspace-report"]

[[phases]]
id = "plan"
needs = [
  "audit-cleanup",
  "audit-tests",
  "audit-structure",
  "audit-instructions",
  "audit-workspace",
]
isolation = "shared"
consumes = [
  "artifact:cleanup-report",
  "artifact:tests-report",
  "artifact:structure-report",
  "artifact:instructions-report",
  "artifact:workspace-report",
]
produces = ["artifact:plan", "artifact:result"]

[dispatch]
roles = [
  "abstraction-architect/abstraction-architect-agent",
  "codebase-map/map-analyst",
  "platform-engineering/platform-reviewer",
  "project-knowledge/documentation-engineer",
  "project-knowledge/guide-reviewer",
  "project-knowledge/instructions-auditor",
  "react-development/react-performance-optimizer",
  "typescript-development/type-safety-auditor",
]
isolated = true
inline_workers = true

[contract]
inputs = [
  "project",
  "objective",
  "scope",
  "authorization",
]
outcomes = ["scope-and-candidate-identified", "deliveries-and-required-gates-accounted", "limits-and-open-actions-visible"]
artifacts = ["result"]
schemas = []
shared_schemas = ["work-controller/contracts/work.toml"]

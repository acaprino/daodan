name = "review-changes"
entrypoint = "review-changes.md"

[[phases]]
id = "prepare"
isolation = "shared"
produces = ["artifact:work"]

[[phases]]
id = "execute"
needs = ["prepare"]
isolation = "shared"
consumes = ["artifact:work"]
produces = ["artifact:result"]

[dispatch]
roles = ["senior-review/code-auditor", "senior-review/premise-auditor"]
isolated = true
inline_workers = true

[contract]
inputs = [
  "project",
  "objective",
  "scope",
  "authorization",
]
outcomes = ["scope-and-candidate-identified", "deliveries-and-required-gates-accounted", "limits-and-open-actions-visible"]
artifacts = ["result"]
schemas = []
shared_schemas = ["work-controller/contracts/work.toml", "work-controller/contracts/project-result.toml"]

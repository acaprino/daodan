# Marketplace consistency checks. Content in this repo is the neutral plugin
# kernels under plugins/ plus the host adapters; everything under exports/ and
# every root marketplace manifest are compiler output. These jobs are
# the mechanical versions of the contracts documented in CLAUDE.md, plus unit
# tests for the helper scripts that have branching logic. The compiler remains
# stdlib-only; the work-controller runtime uses the reviewed YAML parser below.
name: consistency

on:
  push:
    branches: [master]
  pull_request:

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # 3.12 is the Codebase Map helper suite's declared floor: the Python
          # grammar `ast` uses is the running interpreter's, so a suite tested on
          # an older one would not exercise PEP 695/701 parsing at all.
          python-version: "3.12"

      # The OpenCode loader's tests run under `node --test` from the Python
      # suite, and are skipped, not passed, where Node is absent.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependency graph lint
        run: python scripts/lint_dependency_graph.py

      - name: Bundled path lint
        run: python scripts/lint_bundled_paths.py

      - name: Host vocabulary lint
        run: python scripts/lint_host_vocabulary.py

      - name: Plugin documentation and instruction parity
        run: |
          python scripts/sync_plugin_docs.py --check
          python scripts/sync_codex_instructions.py --check

      - name: Install Work Controller runtime parser
        run: python -m pip install 'PyYAML>=6.0.3,<7'

      - name: Unit and contract tests
        run: python -m unittest discover -s tests -v

      - name: Plugin registration lint
        run: python scripts/lint_plugin_registration.py

      - name: Fact anchor lint
        run: python scripts/lint_fact_anchors.py

      # The drift gate. Every committed package and catalog must reproduce
      # byte-for-byte from the kernels and adapters in this commit, or the
      # published marketplaces describe something that is no longer the source.
      - name: Universal marketplace drift check
        run: python scripts/daodan_build.py --check --support

      - name: Copilot write-confinement policy tests
        run: python adapters/copilot/policies/xray-guard/test_xray_guard.py

  # Enforces step 1 of the marketplace update workflow: a change under
  # plugins/<name>/ must bump that plugin's version within the same push or PR.
  # metadata.version is the release number: it may stay, and only moves forward.
  version-bumps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          # 3.12 is the Codebase Map helper suite's declared floor: the Python
          # grammar `ast` uses is the running interpreter's, so a suite tested on
          # an older one would not exercise PEP 695/701 parsing at all.
          python-version: "3.12"

      - name: Version bumps over the pushed or PR range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "base revision unknown (branch creation or pruned history); skipping"
            exit 0
          fi
          python scripts/check_version_bumps.py "$BASE" HEAD

name: Viewer

on:
  push:
    branches: [develop]
    paths: ['viewer/**', 'daodan/assets/**', 'AGENTS.md', 'CLAUDE.md', '.github/workflows/viewer.yml']
  pull_request:
    branches: [develop, main]
    paths: ['viewer/**', 'daodan/assets/**', 'AGENTS.md', 'CLAUDE.md', '.github/workflows/viewer.yml']

permissions:
  contents: read

concurrency:
  group: viewer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  viewer:
    name: Viewer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: viewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # The pages are Sigrid's components alone: no class and no stylesheet of Daodan's (sigrid-check.config.json). One
      # folder at a time.
      - run: npx --no sigrid-check src && npx --no sigrid-check app && npx --no sigrid-check start && npx --no sigrid-check pipeline

      # The frame, the names that are gone, the icons and the agent files, as Imago says them.
      - run: npx --no imago-check

      - run: npx playwright install --with-deps chromium

      - run: npm run test:ui

      # The committed pages are what the source builds. Last, and also after a failed step (the job fails all the same), so one
      # run shows the behaviour and the difference.
      - if: ${{ !cancelled() }}
        run: |
          git diff --exit-code -- ../daodan/assets ../docs/pipeline
          # a page that was never committed is no difference to `git diff`
          test -z "$(git status --porcelain -- ../docs/pipeline)"

      # When the committed pages differ, or anything else failed, keep what the source builds so it can be committed (the pages
      # are not built by hand).
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-assets
          path: daodan/assets
          retention-days: 3

      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-docs
          path: docs/pipeline
          retention-days: 3

  # The two pages at the widths where the frame changes, with the font the suite has on Windows, and what they look like: the owner
  # judges by the photographs.
  frame:
    name: Frame
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: viewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - run: npm ci

      - run: npm run build

      - run: npx playwright install chromium

      - run: npm run test:frame

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viewer-shots
          path: viewer/test/shots
          retention-days: 14

name: Lockfile (throwaway)

# Writes viewer/package-lock.json from package.json and keeps it as an artifact: nothing is installed on a developer's
# machine (AGENTS.md). Deleted from the branch once the lockfile is committed.
on:
  push:
    branches: [develop]
    paths: ['viewer/package.json', '.github/workflows/lockfile.yml']

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: viewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: git status --short -- .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lockfile
          path: viewer/package-lock.json
          retention-days: 1
